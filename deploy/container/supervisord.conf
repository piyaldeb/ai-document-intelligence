[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/docintel/supervisord.pid

[unix_http_server]
file=/tmp/docintel/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/docintel/supervisor.sock

; Internal API (127.0.0.1 only). Documents are processed inside requests (PROCESSING_MODE=inline).
[program:api]
directory=/app
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 --timeout-keep-alive 75
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Public web app on $PORT; proxies /api/* to the API and adds the internal key server-side.
[program:web]
directory=/web
command=sh -c "HOSTNAME=0.0.0.0 exec node server.js"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Public demo: load the sample documents on first start, and refresh them when older than
; DEMO_RESET_HOURS (free hosts have no cron, but the instance restarts after idle periods).
[program:demo-seed]
command=python /etc/docintel/demo_seed.py
priority=30
autostart=%(ENV_DEMO_MODE)s
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
