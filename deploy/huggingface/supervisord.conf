[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/docintel/supervisord.pid

[unix_http_server]
file=/tmp/docintel/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/docintel/supervisor.sock

[program:postgres]
command=postgres -D %(ENV_DATA_DIR)s/pg
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --dir %(ENV_DATA_DIR)s/redis
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
directory=/app
command=sh -c "until pg_isready -h 127.0.0.1 -U docintel -q; do sleep 1; done; createdb -h 127.0.0.1 -U docintel docintel 2>/dev/null || true; alembic upgrade head && exec uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1"
priority=20
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
directory=/app
command=sh -c "until curl -sf http://127.0.0.1:8000/api/health >/dev/null; do sleep 2; done; exec celery -A app.worker.celery_app worker -Q documents,indexing --concurrency=1 --max-tasks-per-child=200 --loglevel=INFO"
priority=30
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
directory=/web
command=node server.js
environment=PORT="7860",HOSTNAME="0.0.0.0"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:seeder]
directory=/app
command=python /opt/docintel/seed_demo.py --loop
priority=40
autorestart=unexpected
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
